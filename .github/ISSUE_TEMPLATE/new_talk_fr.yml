name: '🗣️ Proposition de talk'
description: Proposez un talk pour le prochain meetup
body:
  - type: markdown
    attributes:
      value: |
        Merci de votre intérêt pour le projet et de prendre le temps de proposer un talk pour le prochain meetup!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: 'Décrivez votre talk en quelques phrases.'
    validations:
      required: true
  - type: dropdown
    id: duration
    attributes:
      label: Durée du talk
      options:
        - 5 minutes
        - 10 minutes
        - 20 minutes
        - 30 minutes
    validations:
      required: true
  - type: input
    id: speaker_name
    attributes:
      label: Nom d'affichage
    validations:
      required: true
  - type: input
    id: speaker_email
    attributes:
      label: Ton email
      description: 'Optionnel - si tu veux que nous te contactions par email plutôt que GitHub'
    validations:
      required: false
  - type: input
    id: speaker_one_liner
    attributes:
      description: 'Une phrase pour te présenter (ex: Développeur frontend chez Acme Corp)'
      label: Présentation en une ligne
  - type: input
    id: twitter
    attributes:
      description: 'Ton compte Twitter (ex: https://x.com/posva)'
      label: Twitter
  - type: input
    id: github
    attributes:
      description: 'Ton compte GitHub (ex: @posva)'
      label: GitHub
